[package]
name = "episodic-memory"
version = "4.0.5"
edition = "2024"
description = "Persistent conversation memory for Claude Code and Codex"

[[bin]]
name = "episodic-memory"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
fastembed = "7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
chrono = "0.4"
anyhow = "1"

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
# SQLite INTEGER is i64 while offsets, line numbers and counts are u64/usize;
# values never near the limits, and try_from would add error paths.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Test-only; its assert_eq!(x, [] as [T; 0]) rewrite needs PartialEq on result types.
assert_is_empty = "allow"
dbg_macro = "warn"

[profile.release]
lto = true
strip = true
