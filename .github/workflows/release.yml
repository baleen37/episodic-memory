name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release toolchain
        # package.json devDependencies의 semantic-release 플러그인만 설치한다.
        # --ignore-scripts: postinstall(scripts/conditional-build.sh → `bun run build`)을
        # 건너뛴다. 이 job에는 bun이 없고, 릴리스에 dist 빌드가 필요 없기 때문.
        # (기존 ci.yml도 --ignore-scripts를 사용해 일관됨.)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 릴리스 성공 후 successCmd가 baleen-marketplace로 디스패치할 때 쓴다.
          MARKETPLACE_DISPATCH_TOKEN: ${{ secrets.BALEEN_MARKETPLACE_DISPATCH_TOKEN }}
        run: npx semantic-release
