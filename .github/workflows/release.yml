name: Go Release

# Release pipeline for the Go port. Separate from the TS plugin release
# (.github/workflows/on-release.yml, which dispatches a marketplace update) so
# the two never interfere.
#
# CGO is required and CANNOT cross-compile (yalue/onnxruntime_go +
# daulet/tokenizers need a per-platform C toolchain + native libs). goreleaser's
# split/merge (the native cross-CGO answer) is PRO-only, so this uses
# MATRIX-BUILD-THEN-UPLOAD with OSS goreleaser:
#   - each of the 4 native runners builds ITS goos/goarch with
#     `goreleaser build --single-target` (CGO + provisioned native libs + staged
#     per-platform go:embed assets), tars the binaries, and uploads the archive
#     + its sha256 as an artifact;
#   - a final job downloads all archives, creates a DRAFT GitHub Release, and
#     uploads every archive plus a merged checksums.txt.
#
# Trigger: a v* tag. The release is created as a draft; publish manually after
# smoke-testing each platform's binary.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the publish job creates the GitHub Release + uploads assets.

env:
  GORELEASER_VERSION: "~> v2"
  ORT_VERSION: "1.26.0"

jobs:
  # --- Per-platform native builds (one archive per native runner) ------------
  build:
    strategy:
      fail-fast: true # a single failed platform must abort the whole release.
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-14 # Apple Silicon
            goos: darwin
            goarch: arm64
            tokenizers_asset: darwin-arm64
            ort_macos_arch: arm64
          - target: darwin-amd64
            runs-on: macos-13 # Intel
            goos: darwin
            goarch: amd64
            tokenizers_asset: darwin-x86_64
            ort_macos_arch: x86_64
          - target: linux-amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            tokenizers_asset: linux-amd64
            ort_linux_arch: x64
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tokenizers_asset: linux-arm64
            ort_linux_arch: aarch64
    runs-on: ${{ matrix.runs-on }}
    env:
      CGO_ENABLED: 1
      # --single-target builds for the runner's current GOOS/GOARCH; set them
      # explicitly so the right partition is selected.
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      TOKENIZERS_ASSET: ${{ matrix.tokenizers_asset }}
      ORT_LINUX_ARCH: ${{ matrix.ort_linux_arch }}
      ORT_MACOS_ARCH: ${{ matrix.ort_macos_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history/tags for versioning.

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      # --- Native libs for the CGO link (same provisioning as go-ci.yml) ------
      # daulet/tokenizers is STATIC-linked: download the per-platform
      # libtokenizers.a and point CGO_LDFLAGS at its dir. onnxruntime is NOT a
      # link dep (dlopen'd at runtime); the self-contained MS ORT lib is fetched
      # only to STAGE into the go:embed dir (see the staging-source steps below).
      - name: Provision daulet/tokenizers static lib
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          gh release download v1.27.0 --repo daulet/tokenizers \
            --pattern "libtokenizers.${TOKENIZERS_ASSET}.tar.gz" \
            --dir "$RUNNER_TEMP/native" --clobber
          tar -xzf "$RUNNER_TEMP/native/libtokenizers.${TOKENIZERS_ASSET}.tar.gz" \
            -C "$RUNNER_TEMP/native"   # -> $RUNNER_TEMP/native/libtokenizers.a
          test -f "$RUNNER_TEMP/native/libtokenizers.a"
        env:
          GH_TOKEN: ${{ github.token }}

      # Self-contained MS ORT lib for go:embed staging (NOT brew's — brew's
      # dylib links ~20 kegs and is not shippable). Each platform fetches ITS own
      # MS ORT lib and records the path for the staging hook.
      - name: Provision Microsoft ONNX Runtime lib for embed (macOS)
        if: ${{ matrix.goos == 'darwin' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native"
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-${ORT_MACOS_ARCH}-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          ORT_DIR="$RUNNER_TEMP/native/onnxruntime-osx-${ORT_MACOS_ARCH}-${ORT_VERSION}"
          ORT_LIB="$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib"
          test -f "$ORT_LIB"
          echo "MEMMEM_ORT_LIB_SRC=$ORT_LIB" >> "$GITHUB_ENV"

      - name: Provision Microsoft ONNX Runtime lib for embed (Linux)
        if: ${{ matrix.goos == 'linux' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native"
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-${ORT_LINUX_ARCH}-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          ORT_DIR="$RUNNER_TEMP/native/onnxruntime-linux-${ORT_LINUX_ARCH}-${ORT_VERSION}"
          ORT_LIB="$ORT_DIR/lib/libonnxruntime.so"
          test -f "$ORT_LIB"
          echo "MEMMEM_ORT_LIB_SRC=$ORT_LIB" >> "$GITHUB_ENV"

      # tokenizer.json for go:embed staging (platform-independent). The model is
      # NOT staged — it is downloaded on first run.
      - name: Fetch tokenizer.json for embed
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/native/tokenizer.json" \
            "https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/tokenizer.json"
          echo "MEMMEM_TOKENIZER_SRC=$RUNNER_TEMP/native/tokenizer.json" >> "$GITHUB_ENV"

      - name: Configure CGO link flags
        run: |
          set -euo pipefail
          # Static-link the tokenizer lib. ORT is dlopen'd at runtime (extracted
          # from the embed), so it is NOT a link dependency here.
          echo "CGO_LDFLAGS=-L$RUNNER_TEMP/native" >> "$GITHUB_ENV"

      - name: Setup goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: ${{ env.GORELEASER_VERSION }}

      # Build only this runner's native target. The goreleaser `before` hook runs
      # scripts/stage-runtime-assets.sh, which uses GOOS + MEMMEM_ORT_LIB_SRC +
      # MEMMEM_TOKENIZER_SRC to stage the correct per-platform go:embed assets
      # (libonnxruntime.dylib on macOS, libonnxruntime.so on linux).
      - name: goreleaser build (single target)
        run: goreleaser build --single-target --clean

      # Tar the platform's binaries into the canonical archive name + sha256.
      - name: Archive binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="memmem_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE" out
          # --single-target writes each binary under dist/<id>_<goos>_<goarch>*/.
          find dist -type f \( -name memmem -o -name memmem-mcp \) -exec cp {} "$STAGE/" \;
          test -f "$STAGE/memmem"
          test -f "$STAGE/memmem-mcp"
          tar -czf "out/$ARCHIVE" -C "$STAGE" memmem memmem-mcp
          ( cd out && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256" )
          ls -la out

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: out/
          retention-days: 1

  # --- Aggregate archives + publish the draft GitHub Release -----------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: out/
          merge-multiple: true

      - name: Build merged checksums.txt
        run: |
          set -euo pipefail
          cd out
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -la

      - name: Create draft release + upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            out/*.tar.gz out/checksums.txt
