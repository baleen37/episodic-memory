name: On Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  dispatch-marketplace-update:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update_versions to baleen-marketplace
        uses: baleen37/baleen-marketplace/.github/actions/dispatch-marketplace-update@12f7f29617c0083c78affd8c1e286e0a093fb0f9
        with:
          github-token: ${{ secrets.BALEEN_MARKETPLACE_DISPATCH_TOKEN }}
          event-type: update_versions
          plugin: memmem
          version: ${{ github.event.release.tag_name }}
