name: Update Plugin Versions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types:
      - update_versions

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update action
        uses: baleen37/baleen-marketplace/.github/actions/update-versions@main
        with:
          marketplace-json: .claude-plugin/marketplace.json

      - name: Align standalone plugin metadata
        shell: bash
        run: bash scripts/sync-plugin-versions.sh

      - name: Refresh copied Codex marketplace plugin
        shell: bash
        run: bash scripts/sync-codex-marketplace-plugin.sh

      - name: Verify standalone plugin metadata
        shell: bash
        run: bash scripts/verify-update-versions-workflow.test.sh

      - name: Commit aligned plugin metadata
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- \
            .claude-plugin/marketplace.json \
            .claude-plugin/plugin.json \
            .codex-plugin/plugin.json \
            plugins/memmem; then
            echo "No standalone plugin metadata changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .claude-plugin/marketplace.json \
            .claude-plugin/plugin.json \
            .codex-plugin/plugin.json \
            plugins/memmem
          git commit -m "chore: align standalone plugin metadata"
          git push
