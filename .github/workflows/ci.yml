name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: bun run typecheck

      - name: Runtime compatibility
        run: bun run compat:check

      # Adds sqlite-vec-linux-x64 to package.json — must run AFTER compat:check,
      # which asserts the root package.json matches the plugin manifests.
      - name: Install native sqlite-vec for Linux
        run: bun add -d sqlite-vec-linux-x64 --ignore-scripts

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun test --jobs=1

  e2e:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install native sqlite-vec for Linux
        run: bun add -d sqlite-vec-linux-x64 --ignore-scripts

      - name: Build
        run: bun run build

      - name: Runtime compatibility e2e
        run: bun test src/e2e/
